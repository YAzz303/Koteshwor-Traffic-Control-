# simulation
gui: false
total_episodes: 100
max_steps: 5400
n_cars_generated: 1000
green_duration: 10
yellow_duration: 4
turn_chance: 0.25

# model
num_layers: 4
width_layers: 400
batch_size: 100
learning_rate: 0.001
training_epochs: 800

# memory
memory_size_min: 600
memory_size_max: 50000

# agent
gamma: 0.75

# network
network: original   # folder under intersection/
tls_id: null        # null = the only traffic light in the network

# state
cells_per_lane: 5   # state size = incoming lanes x cells_per_lane (original: 16 x 5 = 80)
