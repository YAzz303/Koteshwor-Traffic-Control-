# simulation
gui: true
max_steps: 5400
n_cars_generated: 1000
green_duration: 10
yellow_duration: 4
turn_chance: 0.25
episode_seed: 10000

# agent
gamma: 0.75

# paths
sumocfg_file: intersection/sumo_config.sumocfg

# baselines (optional; used only by `tlcs baseline`)
# fixed_green_durations: [30, 10, 30, 10]  # green (s) per phase: NS, NS-left, EW, EW-left; default: green_duration each
# actuated_max_green: 60                   # max green (s) for SUMO actuated; min green = green_duration
